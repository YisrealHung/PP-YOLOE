_BASE_: [
  '../runtime.yml',
  './_base_/optimizer_80e.yml',
  './_base_/ppyoloe_plus_crn.yml',
  './_base_/ppyoloe_plus_reader.yml'
]

log_iter: 10
snapshot_epoch: 5
weights: output/ppyoloe_lite_s_custom/model_final
pretrain_weights: https://bj.bcebos.com/v1/paddledet/models/pretrained/ppyoloe_crn_s_obj365_pretrained.pdparams
depth_mult: 0.33
width_mult: 0.5

norm_type: bn

metric: COCO
num_classes: 1

# 🚀 PP-YOLOE-R 核心加速 1: 標籤分配器全面優化
# 將 static_assigner_epoch 設為 -1，徹底跳過計算繁重的 ATSSAssigner，從 Epoch 0 起直接使用 TaskAlignedAssigner
PPYOLOEHead:
  static_assigner_epoch: -1

TrainDataset:
  !COCODataSet
    image_dir: train
    anno_path: annotations/train.json
    dataset_dir: /content/dataset/coco
    data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']

EvalDataset:
  !COCODataSet
    image_dir: val
    anno_path: annotations/val.json
    dataset_dir: /content/dataset/coco

TestDataset:
  !ImageFolder
    anno_path: /content/dataset/coco/annotations/val.json
    dataset_dir: /content/dataset/coco

epoch: 50
LearningRate:
  base_lr: 0.005
  schedulers:
  - !CosineDecay
    max_epochs: 60
    min_lr_ratio: 0.05
  - !LinearWarmup
    start_factor: 0.0
    epochs: 3

worker_num: 4
eval_height: &eval_height 640
eval_width: &eval_width 640
eval_size: &eval_size [*eval_height, *eval_width]

# 🚀 PP-YOLOE-R 核心加速 2: 輕量流線型資料讀取器 (Streamlined Fast Reader)
# 1. 徹底拔除 RandomDistort (每張圖4次CPU像素循環) 與 RandomExpand (4倍畫布顯存拷貝)
# 2. 徹底拔除 BatchRandomResize 多尺度隨機縮放，固定為單一尺寸，釋放 cuDNN 靜態卷積核心性能
# 3. 保留 PadGT 以產生 pad_gt_mask，保證 TaskAlignedAssigner 計算正確
TrainReader:
  sample_transforms:
    - Decode: {}
    - RandomFlip: {}
    - Resize:
        target_size: [*eval_height, *eval_width]
        keep_ratio: False
        interp: 1
  batch_transforms:
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: True}
    - Permute: {}
    - PadGT: {}
  batch_size: 32
  shuffle: true
  drop_last: true
  use_shared_memory: true
  collate_batch: true

EvalReader:
  sample_transforms:
    - Decode: {}
    - Resize:
        target_size: *eval_size
        keep_ratio: False
        interp: 1
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: True}
    - Permute: {}
  batch_size: 2
